[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 119
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 119

[tool.cruft]
skip = [
  "README.md",
  "HISTORY.md",
  "tests",
  "{{ cookiecutter.project_slug }}/cli.py",
]
